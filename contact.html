<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | Portfolio</title>

<style>
/* =================================================
   GLOBAL DARK BLOOD RED THEME
================================================= */

body {
    margin: 0;
    font-family: "Times New Roman", Times, serif;
    color: white;

    background: radial-gradient(circle at top,
        #3b0000 0%,
        #1a0000 40%,
        #0a0000 75%,
        #000000 100%);
}

/* =================================================
   CONTACT SECTION
================================================= */

.contact-section {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;

    padding: 80px 20px;
}

/* TITLE */

.contact-title {
    font-size: 48px;
    letter-spacing: 3px;
    margin-bottom: 10px;
}

/* SUBTITLE */

.contact-subtitle {
    max-width: 600px;
    color: #d6cfcf;
    margin-bottom: 50px;
    font-style: italic;
    line-height: 1.6;
}

/* =================================================
   FORM
================================================= */

.contact-form {
    display: flex;
    flex-direction: column;
    gap: 20px;
    width: 100%;
    max-width: 500px;
}

.contact-form input,
.contact-form textarea {
    background: transparent;
    border: 1px solid #5a0000;
    padding: 14px;
    color: white;
    font-family: "Times New Roman", serif;
    font-size: 16px;
    outline: none;
    transition: 0.3s ease;
}

.contact-form input::placeholder,
.contact-form textarea::placeholder {
    color: #aaaaaa;
}

/* glow focus */

.contact-form input:focus,
.contact-form textarea:focus {
    border-color: #b30000;
    box-shadow: 0 0 12px rgba(179,0,0,0.5);
}

/* BUTTON */

.contact-form button {
    background: #5a0000;
    border: none;
    padding: 14px;
    color: white;
    font-size: 16px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: 0.3s ease;
}

.contact-form button:hover {
    background: #8b0000;
    box-shadow: 0 0 15px rgba(139,0,0,0.7);
}

/* =================================================
   CONTACT LINKS
================================================= */

.contact-links {
    margin-top: 40px;
    display: flex;
    gap: 30px;
}

.contact-links a {
    color: #cfcfcf;
    text-decoration: none;
    transition: 0.3s ease;
    letter-spacing: 1px;
}

.contact-links a:hover {
    color: white;
    text-shadow: 0 0 8px rgba(179,0,0,0.7);
}
</style>
</head>

<body>

<section class="contact-section">

    <h1 class="contact-title">Contact</h1>

    <p class="contact-subtitle">
        If my work speaks to you, let’s create something meaningful together.
    </p>

    <form class="contact-form">
        <input type="text" placeholder="Your Name" required>
        <input type="email" placeholder="Your Email" required>
        <textarea rows="6" placeholder="Your Message..." required></textarea>
        <button type="submit">Send Message</button>
    </form>

    <div class="contact-links">
        <a href="mailto:youremail@email.com">Email</a>
        <a href="https://linkedin.com" target="_blank">LinkedIn</a>
        <a href="https://github.com" target="_blank">GitHub</a>
    </div>

</section>

</body>
</html>
